services:

  lynxprompt:
    image: drumsergio/lynxprompt:2.1.40
    container_name: lynxprompt
    # The image is built for amd64 only; ARM hosts run it under emulation.
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:3000
    expose:
      - 3000
    volumes:
      - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/lynxprompt/uploads:/data/uploads
    environment:
      # NextAuth (required, generate with: openssl rand -base64 32)
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Generate with openssl rand -base64 32}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Promoted to superadmin when this address signs in
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      # Databases: one server, one database per schema; the app creates
      # lynxprompt_users, lynxprompt_blog and lynxprompt_support on first start
      DB_APP_HOST: postgres
      DB_APP_USER: lynxprompt
      DB_APP_PASSWORD: ${POSTGRES_PASSWORD:-DatabasePassword1234}
      DB_APP_NAME: lynxprompt
      DB_USERS_HOST: postgres
      DB_USERS_USER: lynxprompt
      DB_USERS_PASSWORD: ${POSTGRES_PASSWORD:-DatabasePassword1234}
      DB_USERS_NAME: lynxprompt_users
      DB_BLOG_HOST: postgres
      DB_BLOG_USER: lynxprompt
      DB_BLOG_PASSWORD: ${POSTGRES_PASSWORD:-DatabasePassword1234}
      DB_BLOG_NAME: lynxprompt_blog
      DB_SUPPORT_HOST: postgres
      DB_SUPPORT_USER: lynxprompt
      DB_SUPPORT_PASSWORD: ${POSTGRES_PASSWORD:-DatabasePassword1234}
      DB_SUPPORT_NAME: lynxprompt_support
      # Mail (required: sign-in is a link sent by mail)
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP server that sends the sign-in links}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set the sender address of the sign-in mails}
      UPLOAD_DIR: /data/uploads/blog
      # Optional: GitHub sign-in, AI features
      #ENABLE_GITHUB_OAUTH: ${ENABLE_GITHUB_OAUTH:-false}
      #GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      #GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      #ENABLE_AI: ${ENABLE_AI:-false}
      #ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    #networks:
    #  - proxy
    #labels:
    #  - traefik.enable=true
    #  - traefik.docker.network=proxy
    #  - traefik.http.routers.lynxprompt.rule=Host(`lynxprompt.example.com`)
    #  - traefik.http.services.lynxprompt.loadbalancer.server.port=3000

  postgres:
    image: postgres:18-alpine
    container_name: lynxprompt-postgres
    restart: unless-stopped
    expose:
      - 5432
    volumes:
      # Postgres 18 keeps its data one level up and refuses a mount at /var/lib/postgresql/data
      - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/lynxprompt/postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: lynxprompt
      POSTGRES_USER: lynxprompt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DatabasePassword1234}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynxprompt -d lynxprompt"]
      interval: 10s
      timeout: 5s
      retries: 5

