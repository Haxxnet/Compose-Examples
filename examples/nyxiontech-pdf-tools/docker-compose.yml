services:

  nyxiontech-pdf-tools:
    image: ghcr.io/jurecki007/nyxiontech-tools:1.2.0
    container_name: nyxiontech-pdf-tools
    restart: unless-stopped
    expose:
      - 80
    ports:
      - 8080:80/tcp
    healthcheck:
      # the image serves /health; 127.0.0.1 rather than localhost, as the container has no IPv6
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
